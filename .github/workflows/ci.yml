name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, net48)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .slnx 需要 .NET SDK 9.0.200+ 才能被 dotnet build 识别
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build solution
        run: dotnet build EverDefault.slnx -c Release -v minimal
